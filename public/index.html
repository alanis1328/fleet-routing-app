<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planificador de Rutas</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-app: #fcfbfe;
      --bg-sidebar: #ffffff;
      --surface-card: #ffffff;
      --border-soft: #f1e8f8;
      --border-accent: #fbcfe8;
      
      --primary-violet: #8b5cf6;
      --primary-violet-hover: #7c3aed;
      --soft-violet-bg: #ede9fe;
      
      --accent-pink: #ec4899;
      --accent-pink-hover: #db2777;
      --soft-pink-bg: #fce7f3;
      
      --text-main: #1e1b4b;
      --text-muted: #64748b;
      --text-secondary: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: var(--bg-app);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Barra lateral */
    #sidebar {
      width: 420px;
      height: 100%;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(139, 92, 246, 0.05);
      z-index: 1000;
    }

    .header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border-soft);
      background: linear-gradient(180deg, #ffffff 0%, #faf8ff 100%);
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .header p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .action-buttons {
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      background: #faf8ff;
      border-bottom: 1px solid var(--border-soft);
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-route {
      background: var(--soft-violet-bg);
      color: #5b21b6;
      border: 1px solid #ddd6fe;
    }
    .btn-route:hover {
      background: var(--primary-violet);
      color: #ffffff;
      border-color: var(--primary-violet);
      transform: translateY(-1px);
    }

    .btn-add {
      background: var(--soft-pink-bg);
      color: #9d174d;
      border: 1px solid #fbcfe8;
    }
    .btn-add:hover {
      background: var(--accent-pink);
      color: #ffffff;
      border-color: var(--accent-pink);
      transform: translateY(-1px);
    }

    /* Resumen de Ruta */
    #routeSummary {
      display: none;
      margin: 16px 20px 0 20px;
      background: #faf5ff;
      border: 1px solid #e9d5ff;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.04);
    }
    #routeSummary strong {
      color: #7c3aed;
      font-size: 0.95rem;
    }

    /* Lista de tarjetas */
    .passenger-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .passenger-card {
      background: var(--surface-card);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .passenger-card:hover {
      border-color: #ddd6fe;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
    }
    .card-title:hover {
      color: var(--primary-violet);
    }

    .stop-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 9999px;
      background: var(--soft-pink-bg);
      color: #be185d;
      border: 1px solid #fbcfe8;
    }

    .card-info {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      border-top: 1px dashed var(--border-soft);
      padding-top: 10px;
    }

    .card-btn {
      flex: 1;
      background: #faf8ff;
      border: 1px solid var(--border-soft);
      color: #5b21b6;
      border-radius: 8px;
      padding: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .card-btn:hover {
      background: #f3e8ff;
      border-color: #ddd6fe;
    }

    .card-btn-delete {
      color: #9d174d;
    }
    .card-btn-delete:hover {
      background: #ffe4e6;
      border-color: #fecdd3;
      color: #e11d48;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    /* Modal Flotante */
    .modal-overlay {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 420px;
      background: transparent;
      display: none;
      z-index: 2000;
      pointer-events: none;
    }

    .modal-content {
      pointer-events: auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #fbcfe8;
      box-shadow: 0 14px 40px rgba(139, 92, 246, 0.12);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-content h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fafafa;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary-violet);
      background: #ffffff;
    }

    .address-wrapper {
      display: flex;
      gap: 6px;
    }

    .btn-verify {
      background: var(--primary-violet);
      color: #ffffff;
      border: none;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-verify:hover {
      background: var(--primary-violet-hover);
    }

    .map-helper-box {
      background: #fdf2f8;
      border: 1px dashed #f472b6;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.76rem;
      color: #831843;
      margin-bottom: 12px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-cancel:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Barra lateral -->
  <aside id="sidebar">
    <div class="header">
      <h1>Planificador de Rutas</h1>
      <p>Gestión de alumnos y optimización de recorrido</p>
    </div>

    <div class="action-buttons">
      <button class="btn btn-route" onclick="generateShortestRoute()">Ruta Más Corta</button>
      <button class="btn btn-add" onclick="openAddModal()">Agregar Persona</button>
    </div>

    <div id="routeSummary">
      <div>⏱️ Tiempo estimado: <strong id="routeDuration">0 min</strong></div>
      <div>📏 Distancia total: <strong id="routeDistance">0 km</strong></div>
      <div style="font-size: 0.75rem; color: #6b21a8; margin-top: 4px;">*Ruta vial optimizada de punto a punto</div>
    </div>

    <div class="passenger-list" id="passengersContainer">
      <!-- Tarjetas -->
    </div>
  </aside>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Modal Flotante de Registro/Edición -->
  <div class="modal-overlay" id="passengerModal">
    <div class="modal-content">
      <h2 id="modalTitle">Nuevo Alumno</h2>
      <form id="passengerForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editPassengerId" />

        <div style="display: flex; gap: 8px;">
          <div class="form-group" style="flex: 1;">
            <label>Nombres</label>
            <input type="text" id="firstName" placeholder="Ej: Mateo" required />
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Apellidos</label>
            <input type="text" id="lastName" placeholder="Ej: San Martín" required />
          </div>
        </div>

        <div class="form-group">
          <label>Dirección exacta</label>
          <div class="address-wrapper">
            <input type="text" id="address" placeholder="Ej: Barros Arana 650" required />
            <button type="button" class="btn-verify" onclick="searchAddressOnMap()">Buscar</button>
          </div>
          <span id="addressStatus" style="font-size: 0.72rem; color: var(--text-muted); display: block; margin-top: 4px;"></span>
        </div>

        <div class="form-group">
          <label>Nombre del Apoderado</label>
          <input type="text" id="guardianName" placeholder="Ej: Valeria Torres" required />
        </div>

        <div class="form-group">
          <label>Teléfono Apoderado (solo números)</label>
          <input 
            type="tel" 
            id="guardianPhone" 
            placeholder="Ej: +56912345678" 
            pattern="^(\+?56)?(\s?)(9\d{8}|\d{8,9})$" 
            title="Ingresa solo números de teléfono (ej: +56912345678 o 912345678)"
            required 
          />
        </div>

        <!-- Coordenadas ocultas pero obligatorias -->
        <input type="hidden" id="lat" required />
        <input type="hidden" id="lng" required />

        <div class="map-helper-box" id="coordsInfo">
          📍 Haz clic en el mapa para marcar y cambiar la dirección exacta.
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-add" id="saveBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-36.82, -73.05], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let passengers = [];
    let markersLayer = L.layerGroup().addTo(map);
    let routeLayer = L.layerGroup().addTo(map);
    let tempPickerMarker = null;

    // Actualización dinámica al hacer clic en cualquier parte del mapa
    map.on('click', async (e) => {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);

      document.getElementById('lat').value = lat;
      document.getElementById('lng').value = lng;

      // Actualizar marcador visual del punto elegido
      if (tempPickerMarker) {
        map.removeLayer(tempPickerMarker);
      }
      tempPickerMarker = L.circleMarker([lat, lng], {
        radius: 8,
        color: '#ec4899',
        fillColor: '#f472b6',
        fillOpacity: 0.9,
        weight: 3
      }).addTo(map);

      const statusEl = document.getElementById('addressStatus');
      const addressInput = document.getElementById('address');
      
      statusEl.innerText = 'Obteniendo calle...';
      statusEl.style.color = '#8b5cf6';
      document.getElementById('coordsInfo').innerText = `📍 Ubicación seleccionada: (${lat}, ${lng})`;
      document.getElementById('coordsInfo').style.background = '#ede9fe';
      document.getElementById('coordsInfo').style.borderColor = '#8b5cf6';
      document.getElementById('coordsInfo').style.color = '#5b21b6';

      // Reemplaza SIEMPRE la dirección con el nuevo punto seleccionado
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        if (data && data.address) {
          const road = data.address.road || data.address.pedestrian || data.address.suburb || '';
          const house = data.address.house_number ? `#${data.address.house_number}` : '';
          const formatted = road ? `${road} ${house}`.trim() : (data.display_name.split(',')[0] || 'Ubicación seleccionada');
          
          addressInput.value = formatted;
          statusEl.innerText = `Dirección actualizada: ${formatted}`;
          statusEl.style.color = '#059669';
        }
      } catch (err) {
        statusEl.innerText = 'Punto seleccionado en mapa.';
      }
    });

    async function fetchPassengers() {
      try {
        const res = await fetch('/api/passengers');
        passengers = await res.json();
        renderSidebarAndMarkers();
      } catch (err) {
        console.error('Error al cargar pasajeros:', err);
      }
    }

    function renderSidebarAndMarkers(orderedSequence = null) {
      markersLayer.clearLayers();
      const container = document.getElementById('passengersContainer');
      container.innerHTML = '';

      const listToRender = orderedSequence || passengers;

      listToRender.forEach((p, index) => {
        const marker = L.marker([p.latitude, p.longitude]);
        marker.bindPopup(`
          <div style="font-size: 0.9rem;">
            <b style="color: #7c3aed;">${p.first_name} ${p.last_name}</b><br/>
            📍 ${p.address}<br/>
            👤 Apoderado: ${p.guardian_name}<br/>
            📞 ${p.guardian_phone}
          </div>
        `);
        markersLayer.addLayer(marker);

        const card = document.createElement('div');
        card.className = 'passenger-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="card-title">${p.first_name} ${p.last_name}</span>
            ${orderedSequence ? `<span class="stop-badge">Parada #${index + 1}</span>` : ''}
          </div>
          <div class="card-info">
            <span>📍 ${p.address}</span>
            <span>👤 ${p.guardian_name} (📞 ${p.guardian_phone})</span>
          </div>
          <div class="card-actions">
            <button class="card-btn" onclick="openEditModal('${p.id}')">Editar</button>
            <button class="card-btn card-btn-delete" onclick="deletePassenger('${p.id}', '${p.first_name}')">Eliminar</button>
          </div>
        `;

        card.querySelector('.card-info').onclick = () => {
          map.flyTo([p.latitude, p.longitude], 16);
          marker.openPopup();
        };
        card.querySelector('.card-title').onclick = () => {
          map.flyTo([p.latitude, p.longitude], 16);
          marker.openPopup();
        };

        container.appendChild(card);
      });

      if (passengers.length > 0 && !orderedSequence) {
        const bounds = L.latLngBounds(passengers.map(p => [p.latitude, p.longitude]));
        map.fitBounds(bounds.pad(0.2));
      }
    }

    // Buscar coordenadas por texto
    async function searchAddressOnMap() {
      const address = document.getElementById('address').value.trim();
      const statusEl = document.getElementById('addressStatus');

      if (!address) {
        statusEl.innerText = 'Escribe una dirección antes de buscar.';
        statusEl.style.color = '#e11d48';
        return;
      }

      statusEl.innerText = 'Buscando en Concepción...';
      statusEl.style.color = '#8b5cf6';

      try {
        const query = encodeURIComponent(`${address}, Concepción, Chile`);
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`);
        const data = await res.json();

        if (data && data.length > 0) {
          const item = data[0];
          document.getElementById('lat').value = parseFloat(item.lat).toFixed(6);
          document.getElementById('lng').value = parseFloat(item.lon).toFixed(6);
          statusEl.innerText = 'Dirección localizada con éxito.';
          statusEl.style.color = '#059669';

          if (tempPickerMarker) map.removeLayer(tempPickerMarker);
          tempPickerMarker = L.circleMarker([item.lat, item.lon], {
            radius: 8,
            color: '#ec4899',
            fillColor: '#f472b6',
            fillOpacity: 0.9,
            weight: 3
          }).addTo(map);

          map.flyTo([item.lat, item.lon], 16);
          document.getElementById('coordsInfo').innerText = `📍 Ubicación: (${item.lat}, ${item.lon})`;
        } else {
          statusEl.innerText = 'No se encontró la dirección. Marca el punto en el mapa.';
          statusEl.style.color = '#e11d48';
        }
      } catch (err) {
        statusEl.innerText = 'Error al consultar el servicio de mapa.';
      }
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = 'Nuevo Alumno';
      document.getElementById('editPassengerId').value = '';
      document.getElementById('passengerForm').reset();
      document.getElementById('addressStatus').innerText = '';
      document.getElementById('coordsInfo').innerText = '📍 Haz clic en el mapa para marcar y cambiar la dirección exacta.';
      document.getElementById('coordsInfo').style.background = '#fdf2f8';
      document.getElementById('coordsInfo').style.borderColor = '#f472b6';
      document.getElementById('coordsInfo').style.color = '#831843';
      if (tempPickerMarker) map.removeLayer(tempPickerMarker);
      document.getElementById('passengerModal').style.display = 'block';
    }

    function openEditModal(id) {
      const p = passengers.find(item => item.id === id);
      if (!p) return;

      document.getElementById('modalTitle').innerText = 'Editar Información del Alumno';
      document.getElementById('editPassengerId').value = p.id;
      document.getElementById('firstName').value = p.first_name;
      document.getElementById('lastName').value = p.last_name;
      document.getElementById('address').value = p.address;
      document.getElementById('guardianName').value = p.guardian_name;
      document.getElementById('guardianPhone').value = p.guardian_phone;
      document.getElementById('lat').value = p.latitude;
      document.getElementById('lng').value = p.longitude;
      document.getElementById('addressStatus').innerText = '';

      document.getElementById('coordsInfo').innerText = `📍 Ubicación actual: (${p.latitude}, ${p.longitude})`;
      document.getElementById('coordsInfo').style.background = '#ede9fe';
      document.getElementById('coordsInfo').style.borderColor = '#8b5cf6';
      document.getElementById('coordsInfo').style.color = '#5b21b6';

      if (tempPickerMarker) map.removeLayer(tempPickerMarker);
      tempPickerMarker = L.circleMarker([p.latitude, p.longitude], {
        radius: 8,
        color: '#ec4899',
        fillColor: '#f472b6',
        fillOpacity: 0.9,
        weight: 3
      }).addTo(map);

      map.flyTo([p.latitude, p.longitude], 16);
      document.getElementById('passengerModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('passengerModal').style.display = 'none';
      document.getElementById('passengerForm').reset();
      if (tempPickerMarker) map.removeLayer(tempPickerMarker);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editPassengerId').value;
      const addressVal = document.getElementById('address').value.trim();
      const latVal = document.getElementById('lat').value;
      const lngVal = document.getElementById('lng').value;
      const phoneVal = document.getElementById('guardianPhone').value.trim();

      if (!addressVal) {
        alert('Debes ingresar una dirección válida.');
        return;
      }
      if (!latVal || !lngVal) {
        alert('Debes hacer clic en el mapa para marcar el punto exacto de la casa.');
        return;
      }

      const phoneRegex = /^(\+?56)?(\s?)(9\d{8}|\d{8,9})$/;
      if (!phoneRegex.test(phoneVal)) {
        alert('El teléfono debe tener formato válido de solo números (ej: +56912345678 o 912345678).');
        return;
      }

      const payload = {
        first_name: document.getElementById('firstName').value.trim(),
        last_name: document.getElementById('lastName').value.trim(),
        address: addressVal,
        guardian_name: document.getElementById('guardianName').value.trim(),
        guardian_phone: phoneVal,
        latitude: parseFloat(latVal),
        longitude: parseFloat(lngVal)
      };

      const isEdit = Boolean(editId);
      const endpoint = isEdit ? `/api/passengers/${editId}` : '/api/passengers';
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(endpoint, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Ocurrió un error al guardar.');
          return;
        }

        closeModal();
        await fetchPassengers();
      } catch (err) {
        console.error('Error al guardar:', err);
        alert('Error en la comunicación con el servidor.');
      }
    }

    async function deletePassenger(id, name) {
      if (!confirm(`¿Deseas eliminar a ${name}?`)) return;

      try {
        const res = await fetch(`/api/passengers/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('No se pudo eliminar');

        await fetchPassengers();
        routeLayer.clearLayers();
        document.getElementById('routeSummary').style.display = 'none';
      } catch (err) {
        alert('Error al eliminar al alumno.');
      }
    }

    function getPermutations(arr) {
      if (arr.length <= 1) return [arr];
      const result = [];
      for (let i = 0; i < arr.length; i++) {
        const current = arr[i];
        const remaining = [...arr.slice(0, i), ...arr.slice(i + 1)];
        const perms = getPermutations(remaining);
        for (const p of perms) {
          result.push([current, ...p]);
        }
      }
      return result;
    }

    async function generateShortestRoute() {
      if (passengers.length < 2) {
        alert('Se requieren al menos 2 personas registradas para calcular la ruta.');
        return;
      }

      const allPermutations = getPermutations(passengers);
      let bestRoute = null;
      let minDuration = Infinity;
      let bestSequence = null;

      try {
        const routePromises = allPermutations.map(async (sequence) => {
          const coords = sequence.map(p => `${p.longitude},${p.latitude}`).join(';');
          const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
            return { route: data.routes[0], sequence: sequence };
          }
          return null;
        });

        const results = await Promise.all(routePromises);

        results.forEach(res => {
          if (res && res.route.duration < minDuration) {
            minDuration = res.route.duration;
            bestRoute = res.route;
            bestSequence = res.sequence;
          }
        });

        if (!bestRoute || !bestSequence) {
          alert('No se pudo encontrar una ruta viable.');
          return;
        }

        routeLayer.clearLayers();

        // Trazado de ruta en violeta brillante
        const polyline = L.geoJSON({
          type: "Feature",
          geometry: bestRoute.geometry
        }, {
          style: { color: '#8b5cf6', weight: 5, opacity: 0.9 }
        });
        routeLayer.addLayer(polyline);
        map.fitBounds(polyline.getBounds().pad(0.1));

        const durationMin = Math.round(bestRoute.duration / 60);
        const distanceKm = (bestRoute.distance / 1000).toFixed(1);

        document.getElementById('routeDuration').innerText = `${durationMin} min`;
        document.getElementById('routeDistance').innerText = `${distanceKm} km`;
        document.getElementById('routeSummary').style.display = 'block';

        renderSidebarAndMarkers(bestSequence);
      } catch (err) {
        alert('Ocurrió un error al optimizar la ruta.');
      }
    }

    fetchPassengers();
  </script>
</body>
</html>
